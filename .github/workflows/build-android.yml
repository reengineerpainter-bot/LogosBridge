name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Locate and rename APK
        run: |
          TAG="${{ github.ref_name }}"
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK_PATH" "LogosBridge-${TAG}.apk"
          echo "APK: LogosBridge-${TAG}.apk"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "LogosBridge-*.apk"
          name: "LogosBridge ${{ github.ref_name }}"
          body: |
            ## LogosBridge ${{ github.ref_name }} - Android Release

            ### What's New
            - Bible text rendering fully restored
            - Unified pill FAB on Read view (Chapter + Audio + Translation)
            - Study view pill FAB (Chapter + Audio only, no translation menu)
            - Display-only chapter label at top-left on both Read and Study views
            - Removed 'Plain English Translation / Available soon' from Study cards
            - Larger bold chevron icons across all pill controls
            - Offline Bible reading support

            ### Install
            Download the APK, enable Unknown Sources, and install.
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
