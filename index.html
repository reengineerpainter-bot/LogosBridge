<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Primary Config -->
    <title>LogosBridge</title>
    <meta name="description" content="A contemporary and highly readable Bible study assistant tailored for non-native English speakers." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#070b14" />

    <!-- iOS Native App Web Shell Config -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bible Study" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('Service Worker registered successfully!', reg.scope))
            .catch((err) => console.error('Service Worker registration failed:', err));
        });
      }
    </script>
  </head>
  <body style="background-color: #020617; margin: 0; padding: 0;">
    <div id="root">
      <!-- Pre-React Splash Screen Banner -->
      <div style="height: 100vh; width: 100vw; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #020617; font-family: system-ui, -apple-system, sans-serif;">
        <div style="width: 60px; height: 60px; border-radius: 16px; background: linear-gradient(135deg, #22d3ee, #2563eb); box-shadow: 0 0 20px rgba(34, 211, 238, 0.4); display: flex; justify-content: center; align-items: center; margin-bottom: 24px;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
          </svg>
        </div>
        <h1 style="color: #f8fafc; margin: 0 0 8px 0; font-size: 24px; font-weight: 800; letter-spacing: -0.5px;">LogosBridge</h1>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="width: 12px; height: 12px; border: 2px solid #3b82f6; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
          <span style="color: #94a3b8; font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;">Loading Interface</span>
        </div>
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    <!-- Projector Popup Scrollbar Flash Prevention -->
    <script>
      if (window.location.search.includes('projector=true')) {
        document.write('<style>html, body { overflow: hidden !important; } ::-webkit-scrollbar { display: none !important; } * { scrollbar-width: none !important; -ms-overflow-style: none !important; }</style>');
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
